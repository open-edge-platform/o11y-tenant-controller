# Post-Nexus-replacement: tenancy state is fetched from the Tenancy Manager REST API
# (http://tenancy-manager.orch-iam:8080) via the orch-library tenancy.NewPoller, so the
# legacy Nexus/tenancy-datamodel CRD API groups (runtimeproject/projectwatcher/runtime/
# tenancy/config .edge-orchestrator.intel.com) no longer exist and the ClusterRole is
# intentionally empty. The ServiceAccount + binding are retained for the pod identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-tenant-controller
rules: []

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-tenant-controller
subjects:
  - kind: ServiceAccount
    name: observability-tenant-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: observability-tenant-controller
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-tenant-controller
  namespace: {{ .Release.Namespace }}
